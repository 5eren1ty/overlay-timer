[package]
name = "overlay-timer"
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
description = "A Windows presenter countdown with a separate click-through overlay"
default-run = "overlay-timer"

[dependencies]
eframe = { version = "0.36.1", features = ["persistence"] }
egui-winit = { version = "0.36.1", default-features = false }
global-hotkey = "0.8.0"
image = { version = "0.25.10", default-features = false, features = ["gif"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winit = "0.30.13"
tray-icon = { version = "0.24.2", default-features = false }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
strip = "symbols"

[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
